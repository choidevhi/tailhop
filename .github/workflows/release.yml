name: Release

# v* 태그를 push하면 PC 설치 파일과 Android APK를 빌드해 GitHub Release에 올린다.
#
# 보안 규칙(1.5.0):
# - Android 서명 키 시크릿이 없으면 실패한다(디버그 서명 APK로 대신하지 않는다).
# - 올리기 전에 APK가 debuggable이 아닌지, 서명 인증서 SHA-256이 아래 EXPECTED_SIGNER_SHA256과 같은지 확인한다.
#   (저장소 변수 ANDROID_SIGNER_SHA256이 있으면 그 값을 쓴다. 인증서 지문은 공개 값이다.
#    포크는 자기 키의 지문을 이 변수에 넣는다 — README "포크에서 릴리즈 빌드하기".)
# - 권한은 작업마다 최소로: 릴리스를 만드는 release 작업만 contents: write.
# - 서드파티 액션은 커밋 SHA로 고정한다(주석은 그 SHA의 태그).
# - 태그는 셸에 직접 끼워 넣지 않고 환경 변수로 넘기고 형식을 검사한다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈 태그 (예: v1.3.1). 없으면 새로 만든다"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: cmd
        run: windows\build.bat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/TailHop_Setup_*.exe

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 릴리스 서명 인증서(CN=TailHop, O=choidev)의 SHA-256. 키를 바꾸면 이 값(또는 저장소 변수)을 함께 바꾼다.
      EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 || 'e910aa8f1da90619c6e3f7a2c0e84cb040a151fe5458cdacf0410b44f0aff789' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Restore signing key (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android 서명 키 시크릿(ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)이 없다. 디버그 서명으로 대신하지 않고 멈춘다."
            exit 1
          fi
          mkdir -p android/keystore
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/keystore/keystore.properties
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest assembleRelease
      - name: Remove signing key
        if: always()
        run: rm -rf android/keystore
      - name: Verify APK (not debuggable, expected signer)
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::태그 형식이 아니다: $TAG"; exit 1
          fi
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then echo "::error::release APK가 하나가 아니다: ${apks[*]:-없음}"; exit 1; fi
          apk="${apks[0]}"
          case "$apk" in *unsigned*) echo "::error::서명되지 않은 APK"; exit 1 ;; esac
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if "$bt/aapt2" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo "::error::debuggable APK는 올리지 않는다"; exit 1
          fi
          certs="$("$bt/apksigner" verify --print-certs "$apk")"
          # build-tools 버전에 따라 "Signer #1 certificate …" 또는 "V2 Signer: certificate …" 형식이다.
          digests="$(printf '%s\n' "$certs" | sed -n 's/.*certificate SHA-256 digest: *//p' | tr -d ': \r' | tr 'A-F' 'a-f' | sort -u)"
          signers="$(printf '%s' "$digests" | grep -c . || true)"
          if [ "$signers" -ne 1 ]; then echo "::error::서명 인증서가 하나가 아니다($signers)"; exit 1; fi
          got="$digests"
          want="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::서명 인증서가 다르다: $got (기대 $want)"; exit 1
          fi
          echo "서명 확인: $got"
          mkdir -p out
          cp "$apk" "out/TailHop-$TAG.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: out/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::태그 형식이 아니다: $TAG"; exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
